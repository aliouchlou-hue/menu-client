<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maison Ardent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --creme:    #F5F0E8;
      --terre:    #8B4A2F;
      --terre-dk: #6e3822;
      --warm-mid: #C4A882;
      --text:     #2C1F14;
      --sep:      #D4C4B0;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      background: #1a0f08;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(26,15,8,0.58) 0%, rgba(26,15,8,0.38) 45%, rgba(26,15,8,0.72) 100%),
        url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1200&h=900&q=80') center/cover no-repeat;
      transform: scale(1.03);
      transition: transform 8s ease-out;
    }

    .hero-bg.loaded { transform: scale(1); }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .orn-line {
      width: 42px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(196,168,130,0.7));
    }

    .orn-line.r { background: linear-gradient(to left, transparent, rgba(196,168,130,0.7)); }

    .orn-diamond {
      width: 6px; height: 6px;
      background: var(--warm-mid);
      transform: rotate(45deg);
    }

    .hero-label {
      font-size: 0.62rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--warm-mid);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      color: var(--creme);
      line-height: 1.05;
      margin-bottom: 14px;
    }

    .hero-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1rem, 4vw, 1.3rem);
      color: rgba(212,196,176,0.85);
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .hero-tagline {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(196,168,130,0.65);
      margin-bottom: 44px;
    }

    .cta-btn {
      display: inline-block;
      text-decoration: none;
      padding: 16px 36px;
      border: 1px solid rgba(212,196,176,0.55);
      color: var(--creme);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      background: rgba(139,74,47,0.18);
      transition: background 0.25s, border-color 0.25s;
      -webkit-tap-highlight-color: transparent;
    }

    .cta-btn:active {
      background: rgba(139,74,47,0.45);
      border-color: rgba(212,196,176,0.9);
    }

    /* ── FOOTER ── */
    .hero-footer {
      position: absolute;
      bottom: 28px;
      left: 0; right: 0;
      text-align: center;
      z-index: 2;
    }

    .footer-brand {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(196,168,130,0.45);
      margin-bottom: 4px;
    }

    .footer-mv {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.82rem;
      letter-spacing: 0.15em;
      color: rgba(196,168,130,0.35);
    }

    /* ── SCROLL HINT ── */
    .scroll-hint {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: fadeIn 2s ease 1.2s both;
    }

    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    .scroll-hint span {
      display: block;
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, transparent, rgba(196,168,130,0.5));
      animation: scrollLine 2s ease-in-out infinite;
    }

    @keyframes scrollLine {
      0%, 100% { opacity: 0; transform: scaleY(0); transform-origin: top; }
      50% { opacity: 1; transform: scaleY(1); transform-origin: top; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="hero-bg" id="heroBg"></div>

    <div class="hero-content">
      <div class="ornament">
        <span class="orn-line"></span>
        <span class="orn-diamond"></span>
        <span class="orn-line r"></span>
      </div>
      <p class="hero-label">Paris · Depuis 1987</p>
      <h1 class="hero-title">Maison<br>Ardent</h1>
      <p class="hero-subtitle">Cuisine française moderne</p>
      <p class="hero-tagline">Une expérience gastronomique d'exception</p>
      <a href="entrees.html" class="cta-btn">Découvrir la Carte</a>
    </div>

    <div class="scroll-hint"><span></span></div>

    <footer class="hero-footer">
      <p class="footer-brand">Menu numérique par</p>
      <p class="footer-mv">MenuVision</p>
    </footer>
  </section>

  <script>
    window.addEventListener('load', () => {
      document.getElementById('heroBg').classList.add('loaded');
    });
  </script>
</body>
</html>
