<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menu</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#FAFAF7" />
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://menuvision-production.up.railway.app" crossorigin />
  <link rel="stylesheet" href="mv-systeme.css?v=2026-10-14b" />
  <script src="i18n.js?v=2026-10-14a"></script>
  <script src="menu-api.js?v=2026-10-14a"></script>
</head>
<body class="page-accueil">
  <main>
    <section class="accueil-hero" id="hero">
      <div class="hero-image" id="heroImage" aria-hidden="true"></div>
      <div class="hero-contenu">
        <img class="hero-logo" id="heroLogo" alt="" hidden />
        <h1 class="hero-nom" data-mv-nom><span class="sq-titre" aria-hidden="true"></span></h1>
        <p class="hero-accroche" id="heroAccroche" hidden></p>
        <div class="hero-actions">
          <a href="entrees.html" class="btn-plein" data-i18n="accueil.cta">Découvrir la carte</a>
          <a href="#" class="btn-contour" id="lienResa" hidden data-i18n="accueil.reserver">Réserver une table</a>
        </div>
      </div>
    </section>

    <section class="accueil-infos" id="infos" hidden aria-labelledby="infosTitre">
      <h2 class="sr" id="infosTitre" data-i18n="accueil.infos">Informations pratiques</h2>
      <p class="texte-accueil" id="texteAccueil" hidden></p>
      <ul class="infos-liste">
        <li id="infoHoraires" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <div><strong data-i18n="accueil.aujourdhui">Aujourd'hui</strong><span id="horairesJour"></span></div>
        </li>
        <li id="infoAdresse" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <div><span id="adresse"></span></div>
        </li>
        <li id="infoTel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
          <div><a id="tel" href="#"></a></div>
        </li>
      </ul>
    </section>
  </main>

  <footer class="page-footer">
    <p class="propulse" data-i18n="pied.propulse">Propulsé par MenuVision</p>
  </footer>

  <script>
    // Accueil : tout vient du restaurant (/theme). Rien n'est affiché s'il n'est pas renseigné.
    (function () {
      var I = window.MVI18n, t = I.t;
      var JOURS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
      var $ = function (id) { return document.getElementById(id); };
      function poser() {
        var api = window.menuAPI, th = api.theme || {};
        if (th.image_fond_url) {
          var img = new Image();
          img.onload = function () { $('heroImage').style.backgroundImage = 'url("' + th.image_fond_url.replace(/"/g, '%22') + '")'; $('heroImage').classList.add('charge'); };
          img.src = th.image_fond_url;
          $('hero').classList.add('avec-image');
          var l = document.getElementById('mv-langue'); if (l) l.classList.add('sombre');
        }
        if (th.logo_url) { $('heroLogo').src = th.logo_url; $('heroLogo').alt = th.nom || ''; $('heroLogo').hidden = false; }
        if (th.accroche) { $('heroAccroche').textContent = th.accroche; $('heroAccroche').hidden = false; }
        if (th.fonctions && th.fonctions.reservations) {
          $('lienResa').href = 'https://menuvision-production.up.railway.app/reserver?r=' + encodeURIComponent(api.restaurantId) + '&lang=' + I.lang;
          $('lienResa').hidden = false;
        }
        var infos = false;
        if (th.texte_accueil) { $('texteAccueil').textContent = th.texte_accueil; $('texteAccueil').hidden = false; infos = true; }
        var h = th.horaires && th.horaires[JOURS[new Date().getDay()]];
        if (h) {
          var plages = h.ouvert ? ['midi', 'soir'].filter(function (s) { return h[s] && h[s].actif !== false && h[s].debut && h[s].fin; }).map(function (s) { return h[s].debut + ' – ' + h[s].fin; }) : [];
          $('horairesJour').textContent = plages.length ? ' ' + plages.join(' · ') : ' ' + t('accueil.ferme');
          $('infoHoraires').hidden = false; infos = true;
        }
        var adresse = [th.adresse, th.ville].filter(Boolean).join(', ');
        if (adresse) { $('adresse').textContent = adresse; $('infoAdresse').hidden = false; infos = true; }
        if (th.telephone) { $('tel').textContent = th.telephone; $('tel').href = 'tel:' + th.telephone.replace(/[^+0-9]/g, ''); $('tel').setAttribute('aria-label', t('accueil.appeler') + ' ' + th.telephone); $('infoTel').hidden = false; infos = true; }
        $('infos').hidden = !infos;
      }
      if (window.menuAPI && window.menuAPI.ready && window.menuAPI.theme && window.menuAPI.theme.nom) poser();
      else window.addEventListener('menuApiReady', poser, { once: true });
    })();
  </script>
  <script src="appel-serveur.js?v=2026-10-14a"></script>
  <script src="reservation-mode.js"></script>
  <script src="passport.js?v=2026-10-14a"></script>
</body>
</html>
