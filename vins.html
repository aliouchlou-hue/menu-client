<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n-titre="nav.boissons">Boissons</title>
  <meta name="description" content="" />
  <meta name="theme-color" content="#FAFAF7" />
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://menuvision-production.up.railway.app" crossorigin />
  <link rel="stylesheet" href="mv-systeme.css?v=2026-10-14a" />
  <script src="i18n.js?v=2026-10-14a"></script>
  <script src="menu-api.js?v=2026-10-14a"></script>
</head>
<body class="page-carte">
  <header class="page-header">
    <a href="index.html" class="header-back" aria-label="Retour" data-i18n-attr="aria-label:retour">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="header-brand" data-mv-nom></span>
  </header>

  <nav class="top-nav" aria-label="Carte" data-i18n-attr="aria-label:carte.sur">
    <a href="entrees.html" class="tnav-item" data-i18n="nav.entrees">Entrées</a>
    <a href="plats.html" class="tnav-item" data-i18n="nav.plats">Plats</a>
    <a href="desserts.html" class="tnav-item" data-i18n="nav.desserts">Desserts</a>
    <a href="vins.html" class="tnav-item active" aria-current="page" data-i18n="nav.boissons">Boissons</a>
  </nav>

  <main>
    <div class="section-intro">
      <p class="intro-eyebrow" data-mv-nom></p>
      <h1 data-i18n="nav.boissons">Boissons</h1>
      <p data-i18n="intro.boissons">À boire</p>
    </div>
    <div class="section-ornament" aria-hidden="true"><span class="orn-line"></span><span class="orn-diamond"></span><span class="orn-line"></span></div>
    <div class="carte-grille" id="carteGrille" aria-live="polite" aria-busy="true">
      <div class="sq-carte"><div class="sq-img"></div><div class="sq-l"></div><div class="sq-l court"></div></div>
      <div class="sq-carte"><div class="sq-img"></div><div class="sq-l"></div><div class="sq-l court"></div></div>
      <div class="sq-carte"><div class="sq-img"></div><div class="sq-l"></div><div class="sq-l court"></div></div>
    </div>
  </main>

  <footer class="page-footer">
    <p class="propulse" data-i18n="pied.propulse">Propulsé par MenuVision</p>
  </footer>

  <!-- Fiche d'un plat -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div class="modal-img-wrap" id="modalImgWrap">
        <img id="modalImg" alt="" hidden />
        <button type="button" class="modal-close" id="modalClose" aria-label="Fermer" data-i18n-attr="aria-label:fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-top">
          <h2 class="modal-name" id="modalNomAffiche"></h2><span id="modalName" hidden></span>
          <span class="modal-price" id="modalPrice"></span>
        </div>
        <p class="modal-fulldesc" id="modalDesc"></p>
        <p class="allergens-label" data-i18n="fiche.allergenes">Allergènes</p>
        <div class="allergens-list" id="modalAllergens"></div>
        <button type="button" class="btn-ar" id="btnAr" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"/></svg>
          <span data-i18n="fiche.3d">Voir sur ma table en 3D</span>
        </button>
        <div class="ar-wrap" id="arWrap" hidden>
          <model-viewer id="mvEl" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" camera-controls auto-rotate shadow-intensity="1" alt="" data-i18n-attr="alt:fiche.3d.alt">
            <button slot="ar-button" class="ar-launch-btn" data-i18n="fiche.3d.lancer">Voir sur ma table</button>
          </model-viewer>
          <p class="ar-hint" data-i18n="fiche.3d.viser">Pointez vers votre table</p>
          <p class="ar-nosupport" id="arNoSupport" hidden data-i18n="fiche.3d.android">AR disponible sur Android</p>
          <button type="button" class="ar-hide-btn" id="arHideBtn" data-i18n="fiche.3d.masquer">Masquer la vue 3D</button>
        </div>
        <button type="button" class="btn-add" id="btnAdd" data-i18n="fiche.ajouter">Ajouter à ma commande</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Conseiller -->
  <button type="button" class="chat-fab" id="chatFab" aria-controls="chatPanel" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
    <span class="chat-fab-text" data-i18n="chat.bouton">Conseiller</span>
  </button>
  <div class="chat-panel" id="chatPanel" aria-hidden="true">
    <div class="chat-header">
      <div>
        <p class="chat-title" id="chatTitre" data-mv-nom></p>
        <p class="chat-subtitle" data-i18n="chat.sous">Votre conseiller</p>
      </div>
      <button type="button" class="chat-close" id="chatClose" aria-label="Fermer" data-i18n-attr="aria-label:fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages" aria-live="polite">
      <div class="chat-msg ai"><p></p></div>
    </div>
    <div class="chat-suggestions" id="chatSuggestions">
      <button type="button" class="chat-suggestion-btn" data-i18n="chat.s1">Que me conseillez-vous ?</button>
      <button type="button" class="chat-suggestion-btn" data-i18n="chat.s2">J'ai une allergie au gluten</button>
      <button type="button" class="chat-suggestion-btn" data-i18n="chat.s3">Accord mets et vins ?</button>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text" placeholder="Une question sur la carte…" aria-label="Une question sur la carte…" data-i18n-attr="placeholder:chat.saisie;aria-label:chat.saisie" autocomplete="off" />
      <button type="button" class="chat-send" id="chatSend" aria-label="Envoyer" data-i18n-attr="aria-label:envoyer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script src="mv-carte.js?v=2026-10-14a"></script>
  <script>window.PAGE_CATS = ["boisson","boissons","vin","vins","drink","drinks","wine","wines"]; window.PAGE_IS_WINE = false;</script>
  <script src="menu-api-page.js?v=2026-10-14a"></script>
  <!-- Le mode réservation pose son contexte avant que le panier ne le lise -->
  <script src="reservation-mode.js"></script>
  <script src="cart.js?v=2026-10-14a"></script>
  <script src="appel-serveur.js?v=2026-10-14a"></script>
  <script src="passport.js?v=2026-10-14a"></script>
</body>
</html>
