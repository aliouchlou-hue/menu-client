<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title data-i18n-titre="succes.page">Confirmation</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#FAFAF7" />
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="mv-systeme.css?v=2026-10-14c" />
  <script src="i18n.js?v=2026-10-14c"></script>
  <script src="menu-api.js?v=2026-10-14a"></script>
  <style>
    .confirmation { max-width: 560px; margin: 0 auto; padding: calc(56px + env(safe-area-inset-top, 0px)) var(--e-5) var(--e-6); text-align: center; }
    .conf-logo { height: 64px; width: auto; max-width: 160px; object-fit: contain; margin: 0 auto var(--e-4); }
    .conf-nom { font-size: var(--t-xs); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: var(--e-5); }
    .conf-sceau { width: 64px; height: 64px; margin: 0 auto var(--e-5); border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--filet); background: var(--surface); }
    .conf-sceau svg { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .conf-titre { font-family: var(--serif); font-weight: 400; font-size: var(--t-2xl); line-height: 1.08; margin-bottom: var(--e-3); }
    .conf-statut { color: var(--encre-2); margin-bottom: var(--e-6); min-height: 1.5em; }
    .recap { text-align: left; border: 1px solid var(--filet); border-radius: var(--r-3); background: var(--surface); padding: var(--e-5); margin-bottom: var(--e-6); }
    .recap h2 { font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase; color: var(--encre-3); font-weight: 600; margin-bottom: var(--e-3); }
    .recap-ligne { display: flex; gap: var(--e-3); justify-content: space-between; padding: var(--e-2) 0; border-bottom: 1px solid var(--filet); font-size: var(--t-s); }
    .recap-ligne:last-of-type { border-bottom: 0; }
    .recap-ligne span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .recap-total { display: flex; justify-content: space-between; margin-top: var(--e-3); padding-top: var(--e-3); border-top: 1px solid var(--filet); font-weight: 600; }
    .avis { padding-top: var(--e-5); border-top: 1px solid var(--filet); margin-bottom: var(--e-6); }
    .avis-q { font-family: var(--serif); font-size: var(--t-l); margin-bottom: var(--e-2); }
    .avis-aide { font-size: var(--t-xs); color: var(--encre-2); margin-bottom: var(--e-4); }
    .etoiles { display: flex; justify-content: center; gap: var(--e-1); }
    .etoile { width: 48px; height: 48px; border: 0; background: transparent; cursor: pointer; border-radius: var(--r-rond); display: grid; place-items: center; }
    .etoile svg { width: 28px; height: 28px; fill: none; stroke: var(--encre-3); stroke-width: 1.4; stroke-linejoin: round;  }
    .etoile[aria-checked="true"] svg, .etoile.allumee svg { fill: var(--accent); stroke: var(--accent); }
    .avis textarea { width: 100%; min-height: 96px; margin-top: var(--e-4); padding: var(--e-3); border-radius: var(--r-2); border: 1px solid var(--filet); background: var(--fond); color: var(--encre); font: inherit; resize: vertical; }
    .avis .btn-plein { margin-top: var(--e-3); border: 0; cursor: pointer; font-family: var(--sans); }
    .avis-msg { margin-top: var(--e-3); color: var(--encre-2); min-height: 1.5em; }
    .avis-google { display: inline-flex; align-items: center; min-height: 44px; margin-top: var(--e-2); color: var(--accent); }
    .retour { display: inline-flex; align-items: center; min-height: 48px; padding: 0 var(--e-5); border: 1px solid var(--filet); border-radius: var(--r-rond); text-decoration: none; font-size: var(--t-s); }
  </style>
</head>
<body class="page-confirmation">
  <main class="confirmation">
    <img class="conf-logo" id="logo" alt="" hidden />
    <p class="conf-nom" data-mv-nom></p>
    <div class="conf-sceau" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></div>
    <h1 class="conf-titre"><span data-i18n="succes.titre1">Merci pour</span> <span data-i18n="succes.titre2">votre visite</span></h1>
    <p class="conf-statut" id="statut" role="status" aria-live="polite"></p>

    <section class="recap" id="recap" hidden aria-labelledby="recapTitre">
      <h2 id="recapTitre" data-i18n="succes.commande">Votre commande</h2>
      <div id="lignes"></div>
      <div class="recap-total"><span data-i18n="panier.total">Total</span><span id="total"></span></div>
    </section>

    <section class="avis" id="avis" hidden aria-labelledby="avisQ">
      <p class="avis-q" id="avisQ" data-i18n="succes.question">Qu'avez-vous pensé de votre repas ?</p>
      <p class="avis-aide" data-i18n="succes.facultatif">Votre avis est facultatif</p>
      <div class="etoiles" role="radiogroup" aria-labelledby="avisQ" id="etoiles"></div>
      <div id="avisForm" hidden>
        <textarea id="avisTexte" maxlength="500" aria-label="Commentaire" data-i18n-attr="placeholder:succes.commentaire;aria-label:succes.commentaire"></textarea>
        <button type="button" class="btn-plein" id="avisEnvoyer" data-i18n="envoyer">Envoyer</button>
      </div>
      <p class="avis-msg" id="avisMsg" role="status"></p>
      <a class="avis-google" id="avisGoogle" target="_blank" rel="noopener" hidden data-i18n="succes.google">Laisser un avis Google</a>
    </section>

    <a href="entrees.html" class="retour" data-i18n="succes.retour">Retour à la carte</a>
  </main>

  <footer class="page-footer">
    <p class="propulse" data-i18n="pied.propulse">Propulsé par MenuVision</p>
  </footer>

  <script>
    // Confirmation : rien n'est annoncé comme payé sans vérification auprès du serveur
    // (Stripe : identifiant de session ; Redsys : référence de l'opération).
    (function () {
      var RAILWAY = 'https://menuvision-production.up.railway.app';
      var I = window.MVI18n, t = I.t, $ = function (id) { return document.getElementById(id); };
      var q = new URLSearchParams(location.search), sid = q.get('session_id'), ref = q.get('ref');
      var api = function () { return window.menuAPI || {}; };
      function statut(cle) { $('statut').textContent = t(cle); }

      function recap(lignes, total) {
        if (!lignes || !lignes.length) return;
        $('lignes').innerHTML = '';
        lignes.forEach(function (l) {
          var d = document.createElement('div'); d.className = 'recap-ligne';
          var a = document.createElement('span'); a.textContent = I.plat(l.nom).nom + (l.quantite > 1 ? ' × ' + l.quantite : '');
          var b = document.createElement('span'); b.textContent = I.prix((l.montant_cents || 0) / 100);
          d.appendChild(a); d.appendChild(b); $('lignes').appendChild(d);
        });
        $('total').textContent = I.prix((total || 0) / 100);
        $('recap').hidden = false;
      }
      function paye() { try { sessionStorage.removeItem('maCart'); } catch (_) {} }

      function verifier() {
        var rid = api().restaurantId;
        if (sid && rid) {
          statut('succes.verif');
          fetch(RAILWAY + '/paiements/checkout/etat?session_id=' + encodeURIComponent(sid) + '&r=' + encodeURIComponent(rid))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.ok && d.statut === 'paye') { statut('succes.paiement'); recap(d.lignes, d.montant_cents); paye(); }
              else if (d.ok) statut('succes.attente');
              else statut('succes.inconnu');
            }).catch(function () { statut('succes.inconnu'); });
        } else if (ref) {
          statut('succes.verif');
          fetch(RAILWAY + '/paiements/redsys/etat?ref=' + encodeURIComponent(ref))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (d.ok && (d.statut === 'paye' || d.statut === 'rembourse')) { statut(d.type === 'acompte' ? 'succes.acompte' : 'succes.paiement'); recap([{ nom: t(d.type === 'acompte' ? 'succes.acompte' : 'succes.commande'), quantite: 1, montant_cents: d.montant_cents }], d.montant_cents); paye(); }
              else if (d.ok && d.statut === 'en_attente') statut('succes.attente');
              else statut('succes.refuse');
            }).catch(function () { statut('succes.inconnu'); });
        } else statut('succes.sans');
      }

      // Avis sur le repas : seulement si la formule du restaurant recueille les avis.
      function avis() {
        var th = api().theme || {};
        if (!(th.fonctions && th.fonctions.avis)) return;
        $('avis').hidden = false;
        var note = 0, envoye = false, etoiles = [];
        var ETOILE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L12 16.9l-5.25 2.75 1-5.85L3.5 9.65l5.9-.85z"/></svg>';
        for (var n = 1; n <= 5; n++) {
          var b = document.createElement('button'); b.type = 'button'; b.className = 'etoile'; b.dataset.n = n;
          b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false'); b.setAttribute('aria-label', t('avis.note', { n: n }));
          b.innerHTML = ETOILE; $('etoiles').appendChild(b); etoiles.push(b);
        }
        function allumer(v) { etoiles.forEach(function (e) { e.classList.toggle('allumee', +e.dataset.n <= v); e.setAttribute('aria-checked', String(+e.dataset.n === v)); }); }
        function envoyer(commentaire) {
          envoye = true; $('avisMsg').textContent = t('avis.envoi');
          fetch(RAILWAY + '/avis', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ restaurant_id: api().restaurantId, portee: 'repas', note: note, commentaire: commentaire || '', lang: I.lang }) })
            .then(function (r) { return r.json().then(function (j) { return r.ok && j.ok; }); })
            .then(function (ok) {
              if (!ok) throw new Error('refus');
              $('avisMsg').textContent = t('succes.merci'); $('avisForm').hidden = true;
              if (note >= 4 && th.lien_avis_google) { $('avisGoogle').href = th.lien_avis_google; $('avisGoogle').hidden = false; }
            })
            .catch(function () { envoye = false; $('avisMsg').textContent = t('avis.echec'); });
        }
        etoiles.forEach(function (e) {
          e.addEventListener('click', function () {
            if (envoye) return;
            note = +e.dataset.n; allumer(note);
            if (note >= 4) { $('avisForm').hidden = true; envoyer(''); }
            else { $('avisForm').hidden = false; $('avisTexte').focus(); }
          });
        });
        $('avisEnvoyer').addEventListener('click', function () { if (!envoye && note) envoyer($('avisTexte').value.trim()); });
      }

      function pret() {
        var th = api().theme || {};
        if (th.logo_url) { $('logo').src = th.logo_url; $('logo').alt = th.nom || ''; $('logo').hidden = false; }
        verifier(); avis();
      }
      if (window.menuAPI && window.menuAPI.ready && window.menuAPI.theme && window.menuAPI.theme.nom) pret();
      else window.addEventListener('menuApiReady', pret, { once: true });
    })();
  </script>
  <script src="passport.js?v=2026-10-14a"></script>
</body>
</html>
